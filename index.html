<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PayFlow - Paiement & Recharge Mobile</title>
    <!-- Google Fonts + Font Awesome pour les icônes -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fc 0%, #eef2f8 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* Conteneur principal */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03), 0 2px 6px rgba(0,0,0,0.05);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1E3C72, #2A5298);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo span {
            font-size: 0.9rem;
            font-weight: 400;
            color: #5a6e8a;
        }

        .balance-card {
            background: linear-gradient(120deg, #1e2b3c, #0f1a24);
            padding: 0.6rem 1.5rem;
            border-radius: 3rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
        .balance-card i {
            font-size: 1.6rem;
        }
        .balance-info h3 {
            font-size: 0.8rem;
            font-weight: 500;
            opacity: 0.8;
        }
        .balance-info .amount {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Grid layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        /* Cartes génériques */
        .card {
            background: white;
            border-radius: 1.8rem;
            padding: 1.5rem;
            box-shadow: 0 12px 28px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eef2f8;
            padding-bottom: 0.8rem;
        }
        .card-header i {
            font-size: 1.8rem;
            color: #2a5298;
        }
        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e2f41;
        }

        /* Formulaires */
        .input-group {
            margin-bottom: 1.2rem;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4a5b74;
            display: block;
            margin-bottom: 0.3rem;
        }
        input, select {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 1.2rem;
            border: 1.5px solid #e2e8f0;
            background: #fefefe;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.2);
        }

        button {
            background: linear-gradient(95deg, #1E3C72, #2A5298);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.9rem 1.2rem;
            border-radius: 2rem;
            width: 100%;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-top: 0.5rem;
        }
        button i {
            font-size: 1rem;
        }
        button:hover {
            background: linear-gradient(95deg, #14315c, #1f4080);
            transform: scale(0.98);
        }

        .success-msg, .error-msg {
            margin-top: 1rem;
            padding: 0.7rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 500;
        }
        .success-msg {
            background: #e0f2e9;
            color: #1f7840;
        }
        .error-msg {
            background: #ffe6e5;
            color: #c2412c;
        }

        /* Historique / transactions */
        .transactions-list {
            max-height: 320px;
            overflow-y: auto;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 0;
            border-bottom: 1px solid #edf2f7;
        }
        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .transaction-icon {
            width: 40px;
            height: 40px;
            background: #eff3fa;
            border-radius: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2a5298;
        }
        .transaction-details .type {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .transaction-details .date {
            font-size: 0.7rem;
            color: #7e8c9e;
        }
        .transaction-amount {
            font-weight: 700;
            font-size: 1rem;
        }
        .positive {
            color: #1f8b4c;
        }
        .negative {
            color: #c2412c;
        }

        .empty-transaction {
            text-align: center;
            padding: 2rem;
            color: #8f9bb3;
        }

        /* section rapide */
        .quick-actions {
            margin-top: 0.5rem;
            display: flex;
            gap: 1rem;
            justify-content: space-between;
        }
        .quick-btn {
            background: #f0f4fa;
            color: #1e3c72;
            font-size: 0.8rem;
            padding: 0.5rem;
            margin-top: 0;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #6c7a91;
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }
            .header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- En-tête avec solde dynamique -->
    <div class="header">
        <div class="logo">
            <h1>PayFlow <i class="fas fa-bolt"></i></h1>
            <span>Paiements & Recharge instantanés</span>
        </div>
        <div class="balance-card" id="balanceWidget">
            <i class="fas fa-wallet"></i>
            <div class="balance-info">
                <h3>SOLDE DISPONIBLE</h3>
                <div class="amount" id="mainBalance">0.00 €</div>
            </div>
        </div>
    </div>

    <div class="dashboard">
        <!-- Carte RECHARGE -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-plus-circle"></i>
                <h2>Recharger mon compte</h2>
            </div>
            <div class="input-group">
                <label><i class="fas fa-euro-sign"></i> Montant (€)</label>
                <input type="number" id="rechargeAmount" placeholder="Ex: 20, 50, 100" min="1" step="any">
            </div>
            <div class="input-group">
                <label><i class="fas fa-credit-card"></i> Mode de paiement</label>
                <select id="rechargeMethod">
                    <option value="carte">Carte bancaire (simulée)</option>
                    <option value="mobile">Mobile Money (Orange / MTN)</option>
                    <option value="virement">Virement instantané</option>
                </select>
            </div>
            <button id="doRechargeBtn"><i class="fas fa-arrow-up"></i> Recharger maintenant</button>
            <div id="rechargeMessage"></div>
            <div class="quick-actions">
                <button class="quick-btn" data-quick="10">+10€</button>
                <button class="quick-btn" data-quick="25">+25€</button>
                <button class="quick-btn" data-quick="50">+50€</button>
                <button class="quick-btn" data-quick="100">+100€</button>
            </div>
        </div>

        <!-- Carte PAIEMENT (dépense) -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-arrow-right-to-bracket"></i>
                <h2>Effectuer un paiement</h2>
            </div>
            <div class="input-group">
                <label><i class="fas fa-store"></i> Commerçant / Service</label>
                <input type="text" id="merchantName" placeholder="Ex: Amazon, Uber, Netflix, Électricité">
            </div>
            <div class="input-group">
                <label><i class="fas fa-euro-sign"></i> Montant (€)</label>
                <input type="number" id="paymentAmount" placeholder="Montant à payer" min="0.01" step="any">
            </div>
            <div class="input-group">
                <label><i class="fas fa-tag"></i> Catégorie</label>
                <select id="paymentCategory">
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Abonnement">📺 Abonnement</option>
                    <option value="Facture">💡 Facture</option>
                    <option value="Transport">🚗 Transport</option>
                </select>
            </div>
            <button id="doPaymentBtn"><i class="fas fa-credit-card"></i> Payer</button>
            <div id="paymentMessage"></div>
        </div>

        <!-- Historique des transactions -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-clock-rotate-left"></i>
                <h2>Historique</h2>
            </div>
            <div id="transactionsContainer" class="transactions-list">
                <div class="empty-transaction">
                    <i class="fas fa-receipt"></i> Aucune transaction pour le moment
                </div>
            </div>
        </div>
    </div>

    <!-- mini footer info -->
    <footer>
        <i class="fas fa-shield-alt"></i> Transactions sécurisées (simulation) — Solde mis à jour en temps réel
    </footer>
</div>

<script>
    // ---------- STOCKAGE & DONNEES ----------
    // Clé pour localStorage
    const STORAGE_KEY = "payflow_app_data";

    // État initial
    let appState = {
        balance: 125.80,      // Solde initial pour démo (montant positif)
        transactions: []      // tableau des opérations
    };

    // Fonction pour charger depuis localStorage
    function loadState() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (typeof parsed.balance === 'number' && Array.isArray(parsed.transactions)) {
                    appState = parsed;
                }
            } catch(e) { console.warn(e); }
        }
        // S'assurer que balance n'est jamais négatif à l'initialisation (sécurité)
        if (appState.balance < 0) appState.balance = 0;
        // Trier les transactions par date décroissante (plus récent en premier)
        appState.transactions.sort((a,b) => new Date(b.date) - new Date(a.date));
    }

    // Sauvegarde dans localStorage
    function persistState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            balance: appState.balance,
            transactions: appState.transactions
        }));
    }

    // Mise à jour de l'affichage du solde dans le header
    function updateBalanceUI() {
        const balanceSpan = document.getElementById("mainBalance");
        if (balanceSpan) {
            balanceSpan.innerText = appState.balance.toFixed(2) + " €";
        }
        // Optionnel: changer la couleur si solde bas
        const widget = document.getElementById("balanceWidget");
        if (appState.balance < 10) {
            widget.style.background = "linear-gradient(120deg, #6b2e2e, #3a1a1a)";
        } else {
            widget.style.background = "linear-gradient(120deg, #1e2b3c, #0f1a24)";
        }
    }

    // Ajouter une transaction (type: 'recharge' ou 'payment')
    // amount: montant positif pour recharge, négatif pour paiement (ou on donne signe)
    // description, meta
    function addTransaction(type, amountAbs, description, details = {}) {
        let sign = (type === 'recharge') ? +amountAbs : -amountAbs;
        let displayAmount = (type === 'recharge') ? `+${amountAbs.toFixed(2)} €` : `-${amountAbs.toFixed(2)} €`;
        let amountValue = (type === 'recharge') ? amountAbs : -amountAbs;

        const newTransaction = {
            id: Date.now() + Math.floor(Math.random() * 10000),
            type: type,         // "recharge" ou "payment"
            amount: amountValue,
            displayAmount: displayAmount,
            description: description,
            category: details.category || null,
            merchant: details.merchant || null,
            method: details.method || null,
            date: new Date().toISOString()
        };
        appState.transactions.unshift(newTransaction); // ajout en tête
        // Garder max 50 transactions
        if (appState.transactions.length > 50) appState.transactions.pop();
        persistState();
        renderTransactionsHistory();
    }

    // Recharger le compte
    function rechargeAccount(amount, method) {
        if (!amount || amount <= 0) {
            return { success: false, message: "Veuillez saisir un montant valide (supérieur à 0)." };
        }
        // Arrondi à 2 décimales
        const rounded = Math.round(amount * 100) / 100;
        if (rounded <= 0) return { success: false, message: "Montant invalide." };
        
        // Ajouter au solde
        appState.balance += rounded;
        appState.balance = Math.round(appState.balance * 100) / 100;
        
        // Description de la recharge
        let methodLabel = "";
        if (method === "carte") methodLabel = "Carte bancaire";
        else if (method === "mobile") methodLabel = "Mobile Money";
        else methodLabel = "Virement instantané";
        
        const description = `Recharge via ${methodLabel} · ${rounded.toFixed(2)}€`;
        addTransaction("recharge", rounded, description, { method: methodLabel });
        
        persistState();
        updateBalanceUI();
        return { success: true, message: `Recharge de ${rounded.toFixed(2)}€ réussie ! Nouveau solde : ${appState.balance.toFixed(2)}€` };
    }

    // Paiement (dépense)
    function processPayment(merchant, amount, category) {
        if (!merchant || merchant.trim() === "") {
            return { success: false, message: "Veuillez indiquer le nom du commerçant / service." };
        }
        if (!amount || amount <= 0) {
            return { success: false, message: "Montant invalide pour le paiement." };
        }
        const rounded = Math.round(amount * 100) / 100;
        if (rounded > appState.balance) {
            return { success: false, message: `Solde insuffisant. Vous disposez de ${appState.balance.toFixed(2)}€.` };
        }
        // débiter
        appState.balance -= rounded;
        appState.balance = Math.round(appState.balance * 100) / 100;
        
        const description = `Paiement à ${merchant.trim()} (${category})`;
        addTransaction("payment", rounded, description, { merchant: merchant.trim(), category: category });
        
        persistState();
        updateBalanceUI();
        return { success: true, message: `Paiement de ${rounded.toFixed(2)}€ effectué chez ${merchant}. Solde restant : ${appState.balance.toFixed(2)}€` };
    }

    // Rendu historique
    function renderTransactionsHistory() {
        const container = document.getElementById("transactionsContainer");
        if (!container) return;
        
        if (appState.transactions.length === 0) {
            container.innerHTML = `<div class="empty-transaction"><i class="fas fa-receipt"></i> Aucune transaction pour le moment</div>`;
            return;
        }
        
        let html = "";
        for (let tx of appState.transactions) {
            const isRecharge = tx.type === "recharge";
            const iconClass = isRecharge ? "fa-circle-plus" : "fa-credit-card";
            const iconBg = isRecharge ? "#dff0e4" : "#fee2e2";
            const iconColor = isRecharge ? "#1f8b4c" : "#c2412c";
            const amountClass = isRecharge ? "positive" : "negative";
            const amountText = tx.displayAmount;
            const dateObj = new Date(tx.date);
            const formattedDate = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            let extraInfo = "";
            if (tx.type === "payment" && tx.merchant) {
                extraInfo = `<div style="font-size:0.7rem; color:#4b6584;">${tx.merchant}</div>`;
            } else if (tx.type === "recharge" && tx.method) {
                extraInfo = `<div style="font-size:0.7rem; color:#4b6584;">${tx.method}</div>`;
            }
            
            html += `
                <div class="transaction-item">
                    <div class="transaction-left">
                        <div class="transaction-icon" style="background: ${iconBg}; color: ${iconColor};">
                            <i class="fas ${iconClass}"></i>
                        </div>
                        <div class="transaction-details">
                            <div class="type">${tx.type === "recharge" ? "Recharge" : "Paiement"}</div>
                            <div class="date">${formattedDate}</div>
                            ${extraInfo}
                        </div>
                    </div>
                    <div class="transaction-amount ${amountClass}">${amountText}</div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // Gestionnaires UI avec messages dynamiques
    let rechargeMsgTimeout, paymentMsgTimeout;
    function showMessage(elementId, message, isError = false) {
        const container = document.getElementById(elementId);
        if (!container) return;
        container.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}"><i class="fas ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${message}</div>`;
        setTimeout(() => {
            if (container.innerHTML.includes(message)) {
                container.innerHTML = "";
            }
        }, 4000);
    }

    // Evenement recharge
    document.getElementById("doRechargeBtn")?.addEventListener("click", () => {
        let amountInput = document.getElementById("rechargeAmount");
        let methodSelect = document.getElementById("rechargeMethod");
        let rawAmount = parseFloat(amountInput.value);
        if (isNaN(rawAmount)) rawAmount = 0;
        const method = methodSelect.value;
        const result = rechargeAccount(rawAmount, method);
        if (result.success) {
            showMessage("rechargeMessage", result.message, false);
            amountInput.value = "";
        } else {
            showMessage("rechargeMessage", result.message, true);
        }
    });

    // Evenement paiement
    document.getElementById("doPaymentBtn")?.addEventListener("click", () => {
        let merchantInput = document.getElementById("merchantName");
        let amountInput = document.getElementById("paymentAmount");
        let categorySelect = document.getElementById("paymentCategory");
        const merchant = merchantInput.value;
        let amount = parseFloat(amountInput.value);
        if (isNaN(amount)) amount = 0;
        const category = categorySelect.value;
        const result = processPayment(merchant, amount, category);
        if (result.success) {
            showMessage("paymentMessage", result.message, false);
            merchantInput.value = "";
            amountInput.value = "";
        } else {
            showMessage("paymentMessage", result.message, true);
        }
    });

    // raccourcis recharge rapide
    document.querySelectorAll(".quick-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            const val = btn.getAttribute("data-quick");
            if (val) {
                const amountInput = document.getElementById("rechargeAmount");
                amountInput.value = parseFloat(val);
                // Optionnel : déclencher automatiquement la recharge ? On laisse l'utilisateur valider, mais c'est plus intuitif
                // Pour meilleure UX, on peut focus et suggérer
                amountInput.focus();
                // Afficher un petit effet
                const method = document.getElementById("rechargeMethod").value;
                // pas d'auto recharge pour éviter erreur, juste remplir
                showMessage("rechargeMessage", `Montant ${val}€ pré-rempli, cliquez sur Recharger`, false);
                setTimeout(() => {
                    document.getElementById("rechargeMessage").innerHTML = "";
                }, 2000);
            }
        });
    });

    // Initialisation et chargement des données
    function init() {
        loadState();
        // Si aucune transaction et solde par défaut, on peut ajouter un exemple pour illustrer (optionnel)
        if (appState.transactions.length === 0 && appState.balance === 125.80) {
            // Ajouter deux transactions fictives pour démonstration mais on ne veut pas surcharger si c'est déjà initialisé
            // pour éviter de dupliquer, on vérifie que la liste est vide ET le solde initial correspond à 125.80 pour démo propre
            // On va juste insérer deux exemples pour montrer le fonctionnement, sinon l'utilisateur aura une page vide.
            const demoTrans = [
                {
                    id: 1001,
                    type: "recharge",
                    amount: 50,
                    displayAmount: "+50.00 €",
                    description: "Recharge via Carte bancaire · 50.00€",
                    method: "Carte bancaire",
                    date: new Date(Date.now() - 86400000).toISOString()
                },
                {
                    id: 1002,
                    type: "payment",
                    amount: -24.99,
                    displayAmount: "-24.99 €",
                    description: "Paiement à Netflix (Abonnement)",
                    merchant: "Netflix",
                    category: "Abonnement",
                    date: new Date(Date.now() - 172800000).toISOString()
                }
            ];
            if (appState.transactions.length === 0) {
                appState.transactions.push(...demoTrans);
                // Ajuster solde pour cohérence : 125.80 +50 -24.99 = 150.81? Non, on veut garder le solde initial de 125.80, donc on ajuste
                // Le solde actuel est 125.80, mais si on ajoute ces transactions fictives, le solde réel correspond à 125.80 
                // alors que les transactions affichées montrent +50 puis -24.99 -> solde final devrait être (ancien solde +50 -24.99)
                // Pour éviter incohérence on ne modifie pas le solde. Dans un souci de démonstration visuelle, ces transactions sont juste historiques
                // sans modifier le solde actuel. Pour que le total match, on peut recalculer, mais l'utilisateur comprendra la simulation.
                // On préfère conserver solde 125.80 et transactions démo décoratives. Pas grave.
                persistState();
            }
        }
        updateBalanceUI();
        renderTransactionsHistory();
    }
    
    init();
</script>
</body>
</html>
